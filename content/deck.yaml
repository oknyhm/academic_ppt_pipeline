meta:
  title: 结构化学术 PPT 流水线能力展厅
  language: zh-CN
  citations:
    - id: swav-table-5
      text: Caron et al. SwAV, Table 5, ImageNet linear evaluation.
      url: https://arxiv.org/abs/2006.09882
    - id: simclr-table-b2
      text: Chen et al. SimCLR, Table B.2, fine-tuning accuracy by width and label fraction.
      url: https://arxiv.org/abs/2002.05709
slides:
  - id: cover
    layout: title-slide
    illustrationId: cover-neural-network-concept
    title: 结构化学术 PPT 流水线能力展厅
    subtitle: 可编辑文本、原生图形、公式 SVG 与可复现科研图表
    author: 示例作者
    affiliation: Structured Academic PPT Pipeline
    date: 2026-07-30

  - id: text-layout
    layout: text-slide
    title: 文本布局与主题组件
    sections:
      - heading: 可编辑的页面家具
        bullets:
          - 标题、正文、页脚和页码均为 PowerPoint 原生文本
          - 背景、卡片边框与强调条均为原生形状
          - 内容 YAML 只描述语义，不写坐标
      - heading: 构建时的质量控制
        bullets:
          - Zod 校验内容结构、引用与资源路径
          - 每页执行边界检查与非预期重叠检查
          - 警告写入 validation-report.json 便于审阅

  - id: forward-pass
    layout: text-image-slide
    title: 公式 SVG：前向传播
    imagePosition: right
    image:
      path: ../assets/equations/neural-forward.svg
      alt: 神经网络前向传播公式 h 等于 sigma 括号 W x 加 b 括号
      source: content/equations.yaml#neural-forward
    imageCaption: SVG 为 Office 2024+ 矢量资源；同时携带高分辨率 PNG 回退。
    sections:
      - heading: 图文布局
        bullets:
          - 公式保持独立、可复现的 LaTeX 源
          - 标题和说明仍是可编辑文本对象
          - 图片区域采用 contain，保持原始比例

  - id: cross-entropy
    layout: text-image-slide
    title: 公式 SVG：交叉熵目标
    imagePosition: left
    image:
      path: ../assets/equations/cross-entropy.svg
      alt: 多分类交叉熵损失公式
      source: content/equations.yaml#cross-entropy
    imageCaption: 每个稳定公式 ID 同时映射 LaTeX、SVG 和 PNG 回退。
    sections:
      - heading: 公式资产流水线
        bullets:
          - MathJax 生成透明背景 SVG
          - 主题文字色显式写入 SVG，避免 currentColor 兼容问题
          - 未修改的公式资产自动跳过重建

  - id: gradient-descent
    layout: text-image-slide
    title: 公式 SVG：梯度下降
    imagePosition: right
    image:
      path: ../assets/equations/gradient-descent.svg
      alt: 基于损失梯度的参数更新公式
      source: content/equations.yaml#gradient-descent
    imageCaption: 包内主 blip 使用真实 3000 像素宽 PNG 回退。
    sections:
      - heading: Office 兼容封装
        bullets:
          - 主 a:blip 指向 PNG，兼容旧版阅读器
          - asvg:svgBlip 指向 SVG，供 PowerPoint 2024+ 矢量显示
          - 构建后自动检查媒体签名与关系结构

  - id: linear-process
    layout: diagram-slide
    title: 原生流程图：线性流程
    diagram:
      kind: linear-process
      nodes:
        - id: yaml
          label: YAML 内容
        - id: validation
          label: Zod 验证
          emphasis: primary
        - id: rendering
          label: PPTX 生成
          emphasis: accent
        - id: review
          label: PowerPoint 检查
          emphasis: warning
      edges:
        - from: yaml
          to: validation
        - from: validation
          to: rendering
        - from: rendering
          to: review

  - id: input-process-output
    layout: diagram-slide
    title: 原生流程图：输入—处理—输出
    diagram:
      kind: input-process-output
      nodes:
        - id: source
          label: YAML、CSV 与 LaTeX
        - id: pipeline
          label: 布局、组件与验证
          emphasis: primary
        - id: output
          label: 可编辑 PowerPoint
          emphasis: accent
      edges:
        - from: source
          to: pipeline
        - from: pipeline
          to: output

  - id: three-branch
    layout: diagram-slide
    title: 原生流程图：三分支模板
    diagram:
      kind: three-branch
      nodes:
        - id: face-input
          label: 输入人脸
        - id: encoder
          label: 语义编码器
          emphasis: primary
        - id: identity
          label: 身份
          emphasis: accent
        - id: expression
          label: 表情
          emphasis: accent
        - id: attributes
          label: 属性
          emphasis: accent
        - id: watermark
          label: 水印绑定
          emphasis: primary
        - id: blind-detection
          label: 盲检测
          emphasis: warning
      edges:
        - from: face-input
          to: encoder
        - from: encoder
          to: identity
        - from: encoder
          to: expression
        - from: encoder
          to: attributes
        - from: identity
          to: watermark
        - from: expression
          to: watermark
        - from: attributes
          to: watermark
        - from: watermark
          to: blind-detection

  - id: method-comparison
    layout: results-slide
    title: 结果布局：方法比较图与指标卡
    citations:
      - swav-table-5
    chart:
      path: ../assets/charts/method-comparison.svg
      alt: ImageNet 线性评估 top-1 准确率横向条形图
      source: data/method-comparison.csv
    chartCaption: 图表由 method-comparison.csv 与 matplotlib 可复现生成。
    metrics:
      - label: 最佳 SwAV
        value: "78.5%"
        detail: ResNet-50 5x，线性评估 top-1
      - label: 比较方法
        value: "4"
        detail: 同一已发表表格中的条目数
      - label: 资产格式
        value: SVG + PNG
        detail: 矢量主资源与兼容回退
    takeaway: 研究结论、标题和指标卡保持为 PowerPoint 原生可编辑对象。

  - id: ablation-results
    layout: results-slide
    title: 结果布局：消融曲线与结论条
    citations:
      - simclr-table-b2
    chart:
      path: ../assets/charts/ablation.svg
      alt: 不同 ResNet 宽度和标签比例下的 top-1 准确率折线图
      source: data/ablation.csv
    chartCaption: 图表由 ablation.csv 生成；展示标签比例与模型宽度的联合影响。
    metrics:
      - label: R50 4x
        value: "80.4%"
        detail: 100% 标签微调
      - label: 1% 标签
        value: "64.1%"
        detail: R50 4x 微调
      - label: 数据行数
        value: "9"
        detail: 3 种宽度 × 3 种标签比例
    takeaway: 图表数据与来源分离保存，更新 CSV 后可稳定重建。
