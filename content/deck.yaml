meta:
  title: 神经网络原理与指标概览
  language: zh-CN
  citations:
    - id: swav-table-5
      text: Caron et al. SwAV, Table 5, ImageNet linear evaluation.
      url: https://arxiv.org/abs/2006.09882
    - id: simclr-table-b2
      text: Chen et al. SimCLR, Table B.2, fine-tuning accuracy by width and label fraction.
      url: https://arxiv.org/abs/2002.05709
slides:
  - id: cover
    layout: title-slide
    title: 神经网络原理与指标概览
    subtitle: 从前向传播、损失优化到已发表基准结果
    author: 示例作者
    affiliation: 示例研究组
    date: 2026-07-30

  - id: principles
    layout: text-slide
    title: 神经网络的基本组成
    sections:
      - heading: 表示学习
        bullets:
          - 输入特征经由多层线性变换与非线性激活
          - 中间表示逐层提取适合任务的特征
          - 输出层产生分类概率或连续预测
      - heading: 训练目标
        bullets:
          - 损失函数衡量预测与目标之间的差异
          - 优化算法按梯度迭代更新模型参数

  - id: forward-pass
    layout: text-image-slide
    title: 前向传播：线性变换与激活
    imagePosition: right
    image:
      path: ../assets/equations/neural-forward.svg
      alt: h 等于 sigma 括号 W x 加 b 括号的前向传播公式
      source: content/equations.yaml#neural-forward
    imageCaption: 公式 SVG 由 LaTeX 源可重复生成。
    sections:
      - heading: 从输入到隐藏表示
        bullets:
          - W 与 b 是可学习参数
          - 激活函数 sigma 引入非线性表达能力

  - id: objective
    layout: text-image-slide
    title: 监督学习：交叉熵目标
    imagePosition: left
    image:
      path: ../assets/equations/cross-entropy.svg
      alt: 多类别交叉熵损失公式
      source: content/equations.yaml#cross-entropy
    imageCaption: 损失越低表示预测分布越接近目标标签。
    sections:
      - heading: 评价单个训练目标
        bullets:
          - y 表示目标标签的独热编码
          - y 帽表示模型给出的预测概率

  - id: optimization
    layout: text-image-slide
    title: 参数优化：梯度下降
    imagePosition: right
    image:
      path: ../assets/equations/gradient-descent.svg
      alt: 基于损失梯度的参数更新公式
      source: content/equations.yaml#gradient-descent
    imageCaption: 学习率 eta 决定每一步更新的尺度。
    sections:
      - heading: 迭代更新
        bullets:
          - 反向传播计算损失对参数的梯度
          - 沿负梯度方向更新以降低训练目标

  - id: face-semantic-disentanglement
    layout: diagram-slide
    title: 人脸语义解耦与水印检测流程
    diagram:
      kind: three-branch
      nodes:
        - id: face-input
          label: 输入人脸
        - id: encoder
          label: 语义编码器
          emphasis: primary
        - id: identity
          label: 身份
          emphasis: accent
        - id: expression
          label: 表情
          emphasis: accent
        - id: attributes
          label: 属性
          emphasis: accent
        - id: watermark
          label: 水印绑定
          emphasis: primary
        - id: blind-detection
          label: 盲检测
          emphasis: warning
      edges:
        - from: face-input
          to: encoder
        - from: encoder
          to: identity
        - from: encoder
          to: expression
        - from: encoder
          to: attributes
        - from: identity
          to: watermark
        - from: expression
          to: watermark
        - from: attributes
          to: watermark
        - from: watermark
          to: blind-detection

  - id: metrics
    layout: results-slide
    title: 已发表的表示学习指标示例
    citations:
      - swav-table-5
      - simclr-table-b2
    chart:
      path: ../assets/charts/method-comparison.svg
      alt: 已发表 ImageNet 线性评估 top-1 准确率的横向条形图
      source: data/method-comparison.csv
    chartCaption: 已发表结果示例；模型架构不同，不应解读为受控比较。
    metrics:
      - label: SwAV R50-w5
        value: "78.5%"
        detail: Table 5 线性评估 top-1
      - label: SimCLR R50-w4
        value: "76.8%"
        detail: Table 5 线性评估 top-1
      - label: SimCLR 微调
        value: "80.4%"
        detail: Table B.2，100% 标签
    takeaway: 模型指标必须连同数据集、架构和评估协议一起解读。
