meta:
  title: 结构化内容驱动的学术 PPT 生成流水线
  language: zh-CN
  citations:
    - id: swav-table-5
      text: Caron et al. SwAV, Table 5, ImageNet linear evaluation.
      url: https://arxiv.org/abs/2006.09882
    - id: simclr-table-b2
      text: Chen et al. SimCLR, Table B.2, fine-tuning accuracy by width and label fraction.
      url: https://arxiv.org/abs/2002.05709
slides:
  - id: cover
    layout: title-slide
    title: 结构化内容驱动的学术 PPT 生成流水线
    subtitle: 从可验证 YAML 到可编辑 PowerPoint
    author: 示例作者
    affiliation: 示例研究组
    date: 2026-07-30

  - id: motivation
    layout: text-slide
    title: 第一阶段目标
    sections:
      - heading: 可重复的内容构建
        bullets:
          - 使用 YAML 保存研究叙事和页面语义
          - 使用 Zod 在渲染前验证内容结构
          - 保持文字和图示对象可编辑
      - heading: 明确边界
        bullets:
          - 本阶段不接入图像 API、公式和外部图示生成器
          - 先建立稳定的验证与构建基础

  - id: visual-summary
    layout: text-image-slide
    title: 内容与布局分离
    imagePosition: right
    image:
      path: ../assets/diagrams/semantic-layout.svg
      alt: 抽象的结构化内容与版式关系示意
      source: 项目内手工 SVG 资产
    imageCaption: 装饰性示意图，不承载研究结论
    sections:
      - heading: 语义驱动
        bullets:
          - 内容只声明 layout 与可验证字段
          - 布局组件统一管理页面坐标

  - id: pipeline
    layout: diagram-slide
    title: 最小生成流程
    diagram:
      kind: linear-process
      nodes:
        - id: content
          label: YAML 内容
        - id: schema
          label: Schema 验证
        - id: pptx
          label: 可编辑 PPTX

  - id: results
    layout: results-slide
    title: 当前构建能力
    citations:
      - swav-table-5
      - simclr-table-b2
    chart:
      path: ../assets/charts/method-comparison.svg
      alt: 已发表 ImageNet 线性评估 top-1 准确率的横向条形图
      source: data/method-comparison.csv
    chartCaption: 已发表结果示例；模型架构不同，不应解读为受控比较。
    metrics:
      - label: 注册布局
        value: "5"
        detail: 统一返回元素元数据
      - label: 自动检查
        value: "2"
        detail: 边界与非预期重叠
      - label: 示例页面
        value: "5"
        detail: 覆盖全部布局
    takeaway: 结构化内容、可编辑对象与自动验证可在同一构建流程中协作。
